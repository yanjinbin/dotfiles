name: Purge jsDelivr cache

# 当 mihomo/rules 下的 yaml 规则文件更新时，自动清除对应的 jsDelivr CDN 缓存，
# 避免路由器 rule-provider 拉到旧版本（jsDelivr @latest 默认缓存最长 12h）。

on:
  push:
    branches:
      - master
    paths:
      - 'mihomo/rules/**.yaml'
      - 'mihomo/rules/**.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: purge-jsdelivr
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed rule files
        id: collect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # 手动触发或拿不到 before（新分支/force-push）：清掉全部规则文件
            files=$(git ls-files 'mihomo/rules/*.yaml' 'mihomo/rules/*.yml')
          else
            files=$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- 'mihomo/rules/*.yaml' 'mihomo/rules/*.yml')
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed rule files:"; echo "$files"

      - name: Purge jsDelivr
        env:
          FILES: ${{ steps.collect.outputs.files }}
        run: |
          set -uo pipefail
          if [ -z "${FILES//[$'\n\r\t ']/}" ]; then
            echo "No rule yaml changed, nothing to purge."
            exit 0
          fi
          fail=0
          cache_file=$(mktemp)
          trap 'rm -f "$cache_file"' EXIT
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            for ref in HEAD master latest; do
              url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${ref}/${f}"
              echo "Purge $ref: $f"
              if ! curl -fsS --retry 3 --retry-delay 2 "$url" |
                jq -e '.status == "finished" and ([.paths[]?.providers[]?] | length > 0 and all(. == true))' >/dev/null; then
                echo "Purge failed: $ref/$f"
                fail=1
              fi
            done
            verified=0
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --retry 2 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@latest/${f}" -o "$cache_file" &&
                cmp -s "$f" "$cache_file"; then
                verified=1
                break
              fi
              [ "$attempt" = 6 ] || sleep 10
            done
            if [ "$verified" = 1 ]; then
              echo "Verified CDN content: $f"
            else
              echo "CDN content does not match the committed file: $f"
              fail=1
            fi
          done <<< "$FILES"
          exit $fail
