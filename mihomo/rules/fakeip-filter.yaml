payload:
    # 微信/腾讯（图床、长连接必须真实 IP，否则发图/收消息会间歇失败）
    - '+.qq.com'
    - '+.tencent.com'
    - '+.myqcloud.com'
    - '+.weixin.com'
    - '+.qpic.cn'
    - '+.qlogo.cn'
    - '+.gtimg.cn'
    - '+.weixinbridge.com'
    - '+.servicewechat.com'
    # 局域网
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - '*.home.arpa'
    - '+.miwifi.com'
    - '+.miwifi.cn'
    # 时间同步（NTP 走裸 IP，假 IP 会直接失败）
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - '*.ntp.org.cn'
    - '+.pool.ntp.org'
    - 'time1.cloud.tencent.com'
    # 音视频通话（STUN/TURN 裸 UDP）
    - 'stun.*.*'
    - 'stun.*.*.*'
    - 'turn.*.*'
    - 'turn.*.*.*'
    # 苹果推送与更新
    - '+.push.apple.com'
    - 'swscan.apple.com'
    - 'mesu.apple.com'
    # Windows 联网检测
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
