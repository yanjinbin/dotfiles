payload:
  # === Claude 域名族 ===
  # 一条 keyword 覆盖所有含 claude 的域名：claude.ai / claude.com / claude.dev /
  # claude.app / claude.new / claude.site / claudeacademy.com / claudepages.dev /
  # claudestudio.com / chatbotclaude.com / claudemcpclient.com / claudemcpcontent.com /
  # claudeusercontent.com 以及后续新增的 claude* 域名，无需逐条维护
  # 注意：classical 规则集里不写策略，实际出口由模板的 RULE-SET,claude+,Claude专用 决定
  - DOMAIN-KEYWORD,claude

  # === Anthropic 官方域名（不含 claude 关键词，必须单列） ===
  - DOMAIN-SUFFIX,anthropic.com
  - DOMAIN-SUFFIX,anthropic.team
  - DOMAIN-SUFFIX,anthropicusercontent.com
  - DOMAIN-SUFFIX,ant.dev
  - DOMAIN-SUFFIX,antspace.dev
  # Claude 短域名（重定向）
  - DOMAIN-SUFFIX,clau.de

  # === CDN & 静态资源 ===
  # BunnyCDN 静态资源
  - DOMAIN,servd-anthropic-website.b-cdn.net
  # Cloudflare CDN 节点
  - DOMAIN,anthropic.com.cdn.cloudflare.net

  # === 认证 / 内容 ===
  # OAuth 登录认证
  - DOMAIN,anthropic.auth0.com
  # 博客 / CMS 内容
  - DOMAIN,anthropic-com.ghost.io

  # === KYC 身份核验 ===
  # 位置解析；精确匹配，避免 Google Maps 全站被 Keyword/Suffix 带走
  - DOMAIN,maps.googleapis.com
  # 证件 / 自拍核验
  - DOMAIN-SUFFIX,withpersona.com
  # KYC 认证邮件通知
  - DOMAIN-SUFFIX,frompersona.com

  # === 登录风控挑战 ===
  # claude.ai 登录页的 Cloudflare 挑战，出口需与主域名一致
  - DOMAIN-SUFFIX,challenges.cloudflare.com

  # === 监控 & 遥测 ===
  # 功能开关 / AB 测试
  - DOMAIN-SUFFIX,statsigapi.net
  # Claude iOS 时间同步 (解决 App 超时问题)
  - DOMAIN-SUFFIX,datadog.pool.ntp.org
  # Datadog RUM 当前接收端点：域名中间是连字符，suffix 抓不到，单列
  - DOMAIN,browser-intake-us5-datadoghq.com
  # Datadog 各地区端点（us5/us3/eu1/ap1，含 datadoghq.com/.eu）
  - DOMAIN-KEYWORD,datadog
  # Sentry 通配兜底
  - DOMAIN-KEYWORD,sentry
  # 反欺诈检测
  - DOMAIN-KEYWORD,sift
  # 遥测分析
  - DOMAIN,api.segment.io

  # === 客服 / 订阅 / 第三方 widget ===
  # iOS App 订阅/内购状态验证
  - DOMAIN,api.revenuecat.com
  # Intercom 在线客服
  - DOMAIN-SUFFIX,intercom.io
  # Intercom 静态资源 CDN
  - DOMAIN-SUFFIX,intercomcdn.com
  # Fathom 访问统计（含 CDN）
  - DOMAIN-SUFFIX,usefathom.com

  # === IP 兜底 ===
  # Anthropic 自有 IPv4 段，域名规则漏配时的最后防线
