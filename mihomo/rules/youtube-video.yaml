# NAME: YouTubeMedia
# AUTHOR: yanjinbin
# REPO: https://github.com/yanjinbin/dotfiles/mihomo/rules
# UPDATED: 2026-11-27
# DOMAIN-SUFFIX: 8
# TOTAL: 8
#
# YouTube / Google 媒体与静态资源 CDN（含缩略图、图片）。放在 UDP/443 闸门之前，
# 让浏览器先用 QUIC 拉图，避免首屏图片被 REJECT 后回退变慢。
payload:
  - DOMAIN-SUFFIX,youtube.com
  - DOMAIN-SUFFIX,youtu.be
  - DOMAIN-SUFFIX,youtube-nocookie.com
  - DOMAIN-SUFFIX,googlevideo.com
  - DOMAIN-SUFFIX,ytimg.com
  - DOMAIN-SUFFIX,ggpht.com
  - DOMAIN-SUFFIX,gstatic.com
  - DOMAIN-SUFFIX,googleusercontent.com
