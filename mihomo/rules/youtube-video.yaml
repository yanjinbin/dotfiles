# NAME: YouTubeMedia
# AUTHOR: yanjinbin
# REPO: https://github.com/yanjinbin/dotfiles/mihomo/rules
# UPDATED: 2026-11-26
# DOMAIN: 1
# DOMAIN-SUFFIX: 6
# TOTAL: 7
#
# YouTube 页面 / 缩略图 / 视频 CDN。放在 UDP/443 闸门之前，
# 让浏览器先用 QUIC 拉封面，避免首屏图片被 REJECT 后回退变慢。
payload:
  - DOMAIN-SUFFIX,youtube.com
  - DOMAIN-SUFFIX,youtu.be
  - DOMAIN-SUFFIX,youtube-nocookie.com
  - DOMAIN-SUFFIX,googlevideo.com
  - DOMAIN-SUFFIX,ytimg.com
  - DOMAIN-SUFFIX,ggpht.com
  - DOMAIN,yt3.googleusercontent.com
