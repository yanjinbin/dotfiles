# NAME: APNs
# AUTHOR: yanjinbin (custom)
# UPDATED: 2026-10-04

payload:
  # ── Apple Push Notification Service ──

  # 主域名（含 courier.push.apple.com 推送通道）
  - DOMAIN-SUFFIX,push.apple.com

  # Akamai 加速（很多人漏掉）
  - DOMAIN-SUFFIX,push-apple.com.akadns.net

  # iOS 内部推送进程（增强命中）
  - PROCESS-NAME,apsd

  # Apple IPv4 网段
  - IP-CIDR,17.0.0.0/8,no-resolve
