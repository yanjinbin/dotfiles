theme = "Apple Graphite"
theme-dark = "apple-graphite"
language = "chinese"

open-with-app = "VS Code|com.microsoft.VSCode"
open-with-app = "Xcode|com.apple.dt.Xcode"

privilege-sound-on-error = true

privilege-notification-on-finish = true

font-size = 19

dock-icon-animate-progress = true

font-family = "MesloLGS NF Herdr"
font-family-fallback = ["Herdr Agent Icons Max"]

copy-on-select = true

text-blink = true

adjust-cell-height = "20%"

# default-git-client = "com.github.GitHubClient" (reset to default)

notification-sound = ["error", "finish", "app"]

omit-otty-prefix = true

cli-allow-overwrite = true

tab-rule = 'path="~/WebstormProjects/7th-ALS" alias="ALS"'

# window-hide-dirty-indicator = true (reset to default)

# auto-hide-tabs-panel = "always" (reset to default)

# window-layout = "tabs-top" (reset to default)

foreground = "#e5e5ea"
background = "#1c1c1e"
palette-0 = "#2c2c2e"
palette-1 = "#ff6961"
palette-2 = "#70c88b"
palette-3 = "#e9c46a"
palette-4 = "#64a8ff"
palette-5 = "#c49be8"
palette-6 = "#70c7ce"
palette-7 = "#d1d1d6"
palette-8 = "#aaaab2"
palette-9 = "#ff867f"
palette-10 = "#91d9a6"
palette-11 = "#f4d58a"
palette-12 = "#8bbdff"
palette-13 = "#d6b4f2"
palette-14 = "#95dade"
palette-15 = "#f5f5f7"
selection-foreground = "#f5f5f7"
selection-background = "#34465e"
cursor-color = "#64a8ff"
cursor-text = "#1c1c1e"
