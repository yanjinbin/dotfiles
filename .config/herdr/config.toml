onboarding = false
[keys]

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-usage.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-usage.open-settings"
description = "open agent quota settings"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-linear.open"
description = "Linear: issues and projects"


[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "nathanflurry.jj-workspace.new-tab"
description = "new jj workspace"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "nathanflurry.jj-workspace.remove"
description = "remove jj workspace"


[ui.toast]
delivery = "herdr"

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/yanjinbin/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

status_indicators = "symbols"
agent_panel_sort = "spaces" # herdr-agent-usage
tab_bar_position = "top"
hide_tab_bar_when_single_tab = false

[theme]
name = "one-dark"
auto_switch = false
dark_name = "one-dark"
light_name = "one-light"

