onboarding = false
[keys]

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-usage.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-usage.open-settings"
description = "open agent quota settings"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"


[ui.toast]
delivery = "herdr"

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/yanjinbin/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

status_indicators = "symbols"
agent_panel_sort = "spaces" # herdr-agent-usage

[theme]
name = "one-dark"
auto_switch = true
dark_name = "one-dark"
light_name = "one-light"

# Use built-in names so rows stay visible without plugin metadata.
[ui.sidebar.agents]
row_gap = 1
rows = [[{ token = "state_icon", bold = false, dim = false }, { token = "agent", bold = true, dim = false }], [{ token = "terminal_title_stripped", bold = false, dim = false }]]

